<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play a Hole</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
      /* ---------- The prompt panel that sits on top of the 3D scene ---------- */
      #panel {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: min(460px, 92vw);
        padding: 12px 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.94);
        color: #1f3d2b;
        text-align: center;
        font-family: "Nunito", system-ui, sans-serif;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        z-index: 10;
      }
      #panel h2 {
        margin: 0 0 8px;
        font-size: 1.2rem;
        font-weight: 700;
      }
      #panel p {
        margin: 0 0 10px;
        font-size: 0.9rem;
        line-height: 1.35;
      }
      #panel p.hint {
        margin: 0 0 10px;
        font-size: 0.85rem;
        font-style: italic;
        color: #5d7a68;
      }
      #panel p.error {
        margin: 0 0 10px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #c4505c;
      }
      #panel p.error:empty {
        display: none;
      }
      #panel p.note {
        font-style: italic;
        color: #c4505c;
        margin-bottom: 8px;
      }
      #panel p.shot {
        margin: 0 0 4px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c4505c;
      }
      /* ---------- The message shown while the ball is flying ---------- */
      #shot-message {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(520px, 90vw);
        padding: 12px 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: #1f3d2b;
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.1rem;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s;
        z-index: 10;
      }
      #shot-message.show {
        opacity: 1;
      }
      #shot-message.rough {
        color: #c4505c;
      }

      /* ---------- Full screen button, bottom right ---------- */
      #fs-button {
        position: fixed;
        right: 10px;
        bottom: 12px;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        color: #1f3d2b;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.6;
        transition: opacity 0.2s;
        z-index: 11;
      }
      #fs-button:hover,
      #fs-button:focus-visible {
        background: rgba(255, 255, 255, 0.95);
        color: #1f3d2b;
        opacity: 1;
      }

      /* ---------- Tiny see-through volume slider on the right edge ---------- */
      #volume-box {
        position: fixed;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0.4;
        transition: opacity 0.2s;
        z-index: 11;
      }
      #volume-box:hover,
      #volume-box:focus-within {
        opacity: 1;
      }
      .vol-icon {
        color: #fff;
        font-size: 14px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      }
      .vol-track {
        position: relative;
        width: 20px;
        height: 110px;
      }
      #volume {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 110px;
        margin: 0;
        transform: translate(-50%, -50%) rotate(-90deg);
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
      }
      #volume::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.75);
      }
      #volume::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.75);
      }
      #volume::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        margin-top: -4px;
        border: none;
        border-radius: 50%;
        background: #fff;
      }
      #volume::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background: #fff;
      }
      #volume:focus-visible {
        outline: 2px solid #e8737f;
        outline-offset: 6px;
      }
      #panel.bottom {
        top: auto;
        bottom: 12px;
      }
      #panel.bottom .recap {
        max-height: 22vh;
      }
      .recap {
        text-align: left;
        max-height: 38vh;
        overflow-y: auto;
        margin: 0 0 14px;
      }
      .recap-item {
        margin-bottom: 10px;
      }
      #panel p.recap-q {
        margin: 0;
        font-size: 0.75rem;
        color: #5d7a68;
      }
      #panel p.recap-a {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 8px 14px;
        border: 2px solid #1f3d2b;
        border-radius: 999px;
        background: #fff;
        color: #1f3d2b;
        cursor: pointer;
      }
      button:hover {
        background: #1f3d2b;
        color: #fff;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #e8737f;
        outline-offset: 2px;
      }
      button.primary {
        background: #1f3d2b;
        color: #fff;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 56px;
        padding: 8px;
        margin-bottom: 8px;
        border: 2px solid #9bbfa8;
        border-radius: 12px;
        font: inherit;
        resize: vertical;
      }
    </style>
  </head>

  <body>
    <!-- ================= THE 3D WORLD ================= -->
    <!--
      MAP (seen from above). x = left/right, z = forward/back.
      The hole is a "dogleg right": straight, then a sharp 90-degree bend.

                 x=-4   x=4                       x=28
        z=-20          |==============================|   <- leg 2 (runs right)
        z=-24     BEND *---------> -------> ---> (HOLE at x=24)
        z=-28          |==============================|
                 |  |
                 |  |   leg 1 (runs forward), with a thick forest on the
                 |  |   inside of the bend that hides the hole
        z=0    TEE
    -->
    <a-scene vr-mode-ui="enabled: false" fog="type: linear; color: #bfe3f5; near: 45; far: 220">
      <!-- Sky and ground -->
      <a-sky color="#bfe3f5"></a-sky>
      <a-plane rotation="-90 0 0" width="600" height="600" color="#5f9f6e"></a-plane>

      <!-- Fairway leg 1: from the tee forward to the bend (8 wide, 32 long) -->
      <a-plane
        rotation="-90 0 0"
        position="0 0.01 -12"
        width="8"
        height="32"
        color="#8cc79a"
      ></a-plane>

      <!-- Fairway leg 2: from the bend to the right, toward the hole (32 long, 8 wide) -->
      <a-plane
        rotation="-90 0 0"
        position="12 0.012 -24"
        width="32"
        height="8"
        color="#8cc79a"
      ></a-plane>

      <!-- Water by the tee, sand on the outside of the bend and near the green -->
      <a-circle rotation="-90 0 0" position="-6 0.02 1" radius="2.2" color="#7f9fe0"></a-circle>
      <a-circle rotation="-90 0 0" position="-5.5 0.02 -26" radius="1.8" color="#e6d3b3"></a-circle>
      <a-circle rotation="-90 0 0" position="20 0.02 -29.4" radius="1.4" color="#e6d3b3"></a-circle>

      <!-- The tee box: a lighter square around the ball and the two red tee markers -->
      <a-plane rotation="-90 0 0" position="0 0.04 0" width="5.2" height="5.2" color="#7dbf8e"></a-plane>
      <a-plane rotation="-90 0 0" position="0 0.07 0" width="4.6" height="4.6" color="#b9ecb0"></a-plane>

      <!-- Red tee markers -->
      <a-cylinder position="-1.5 0.3 0" radius="0.1" height="0.6" color="#e03a2f"></a-cylinder>
      <a-cylinder position="1.5 0.3 0" radius="0.1" height="0.6" color="#e03a2f"></a-cylinder>

      <!-- The hole and the flag, at the end of leg 2 -->
      <!-- The putting green: a bright, lighter circle around the hole, with a slightly darker ring around it -->
      <a-circle rotation="-90 0 0" position="24 0.04 -24" radius="3.9" color="#7dbf8e"></a-circle>
      <a-circle rotation="-90 0 0" position="24 0.07 -24" radius="3.4" color="#b9ecb0"></a-circle>
      <a-circle rotation="-90 0 0" position="24 0.1 -24" radius="0.35" color="#111"></a-circle>
      <a-cylinder position="24 2 -24" radius="0.08" height="4" color="#ffffff"></a-cylinder>
      <a-plane
        position="24 3.45 -23.1"
        rotation="0 90 0"
        width="1.8"
        height="1.1"
        color="#e8737f"
        side="double"
      ></a-plane>

      <!-- Trees get added here by the script at the bottom -->
      <a-entity id="trees"></a-entity>

      <!--
        CAMERA RIG: the camera lives inside this entity. Moving or rotating the rig
        moves the camera. It sits 6.5 units behind wherever the rig is placed.
      -->
      <a-entity id="player" position="0 0 0" rotation="0 0 0">
        <a-camera position="0 1.6 6.5" wasd-controls="enabled: false"></a-camera>
      </a-entity>

      <!-- The golf ball: separate from the camera so it can fly ahead of it -->
      <a-sphere id="ball" position="0 0.3 0" radius="0.3" color="#ffffff"></a-sphere>
    </a-scene>

    <!-- ================= THE PROMPT PANEL (regular HTML) ================= -->
    <div id="panel"></div>

    <!-- The message that appears while the ball is in flight -->
    <div id="shot-message"></div>

    <!-- ================= MUSIC VOLUME (tiny slider on the right) ================= -->
    <div id="volume-box">
      <span class="vol-icon" aria-hidden="true">&#9834;</span>
      <div class="vol-track">
        <input type="range" id="volume" min="0" max="100" value="50" aria-label="Music volume" />
      </div>
    </div>

    <!-- ================= FULL SCREEN BUTTON ================= -->
    <button id="fs-button" aria-label="Toggle full screen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
    </button>

    <script>
      // ---------- 1. THE PROMPTS ----------
      // Edit this list to change the questions. Each one is a "shot".
      const prompts = [
        {
          type: "choice",
          text: "How was your day?",
          options: ["Fantastic", "Meh", "Not my best"],
        },
        {
          type: "text",
          text: "What made your day {day}?",
          placeholder: "Type it out. No one else will see this.",
        },
        {
          type: "text",
          // A different question for each Q1 answer (the names must match the Q1 buttons exactly)
          text: {
            "Fantastic": "Now that you're home, is there anything you want to brag about?",
            "Not my best": "Name something that you are proud of that you did today.",
            "Meh": "Did you have any small, surprisingly fun moments or interactions that brightened your day, even a little?",
          },
          placeholder: "Even something small counts.",
        },
        {
          type: "text",
          text: "If you could improve something tomorrow from today, what would it be?",
          placeholder: "Big or small, anything you'd do differently.",
        },
      ];

      // ---------- 1b. HOW EACH Q1 ANSWER READS INSIDE A SENTENCE ----------
      // Left side = the button they clicked. Right side = the words we drop into {day}.
      const dayWords = {
        "Fantastic": "fantastic",
        "Meh": "meh",
        "Not my best": "not your best",
      };

      // ---------- 2. THE ROUTE (where the ball can end up after each shot) ----------
      // fairway = where the ball lands if the shot goes well, as "x y z"
      // rough   = where it lands otherwise (off to the side, on the darker grass)
      // turn    = which way the camera faces. 0 = forward, -90 = turned right.
      // note    = optional message shown on the panel when you arrive there
      // There must be ONE MORE route entry than prompts (entry 0 is the tee).
      const route = [
        { fairway: "0 0 0", rough: "0 0 0", turn: 0 }, // the tee
        { fairway: "0 0 -12", rough: "-4.8 0 -12", turn: 0 }, // after shot 1
        { fairway: "0 0 -24", rough: "-4.8 0 -24", turn: -90 }, // shot 2 reaches the bend, then we turn right
        { fairway: "12 0 -24", rough: "12 0 -28.8", turn: -90 }, // after shot 3
        { fairway: "24 0 -24", rough: "24 0 -24", turn: -90 }, // shot 4: always the hole
      ];

      // ---------- 2b. WHICH ANSWERS LAND IN THE FAIRWAY OR THE ROUGH ----------
      // Choice questions: look the button up in this list.
      const choiceLies = {
        "Fantastic": "fairway",
        "Meh": "rough",
        "Not my best": "rough",
      };
      // Typed questions: an answer this many characters or longer lands in the fairway.
      const FAIRWAY_MIN_CHARS = 25;
      // Typed answers shorter than this are not accepted yet (an error asks for a bit more).
      const MIN_ANSWER_CHARS = 10;

      function getLie(prompt, answer) {
        if (prompt.type === "choice") {
          return choiceLies[answer] || "fairway"; // fairway if the button isn't in the list
        }
        return answer.length >= FAIRWAY_MIN_CHARS ? "fairway" : "rough";
      }

      const FLIGHT_MS = 1500; // how long the ball is in the air before it first touches down
      const RIG_MS = 1600; // how long the camera takes to walk up to the ball
      const TURN_MS = 2000; // how long the turn at the bend takes

      // ---------- 3. THINGS WE NEED TO KEEP TRACK OF ----------
      const player = document.querySelector("#player");
      const ball = document.querySelector("#ball");
      const panel = document.querySelector("#panel");
      const shotMessage = document.querySelector("#shot-message");

      let current = 0; // how many shots have been taken so far
      const answers = []; // just the answers, in order (used for the lookups)
      const responses = []; // each question paired with its answer (used for the final recap)
      // Both live only in this browser tab. Nothing is saved or sent anywhere.

      // ---------- 4. SHOWING WHAT IS ON THE PANEL ----------
      // Swaps {day} in a question for the right words, based on their Q1 answer
      function fillIn(text) {
        // If the question is a list of options (like Q3), pick the one for their Q1 answer
        if (typeof text === "object") {
          text = text[answers[0]] || Object.values(text)[0]; // first option if nothing matches
        }
        const dayWord = dayWords[answers[0]] || "";
        return text.replace("{day}", dayWord);
      }

      function showStart() {
        panel.innerHTML = `
          <h2>Take a break. Play a hole.</h2>
          <p>Answer each question to get the ball in the hole, and most importantly make your day a little bit better!</p>
          <button class="primary" id="go">Click here to tee off</button>`;
        document.querySelector("#go").onclick = () => {
          startMusic(); // browsers only allow sound after a click, so the music starts here
          showPrompt();
        };
      }

      function showPrompt() {
        const p = prompts[current];
        const note = route[current].note ? `<p class="note">${route[current].note}</p>` : "";
        const label = `<p class="shot">Shot ${current + 1} of ${prompts.length}</p>`;
        const question = fillIn(p.text); // the question, with {day} filled in

        if (p.type === "choice") {
          panel.innerHTML = `${label}${note}<h2>${question}</h2><div class="options"></div>`;
          const box = panel.querySelector(".options");
          p.options.forEach((optionText) => {
            const b = document.createElement("button");
            b.textContent = optionText;
            b.onclick = () => hitShot(optionText);
            box.appendChild(b);
          });
        } else {
          panel.innerHTML = `
            ${label}
            ${note}
            <h2>${question}</h2>
            <p class="hint">The more thoughtful the answer, the better the shot!</p>
            <textarea id="answer" placeholder="${p.placeholder}"></textarea>
            <p class="error" id="error" role="alert"></p>
            <button class="primary" id="hit">Hit the shot</button>`;
          const box = document.querySelector("#answer");
          const error = document.querySelector("#error");
          box.focus();
          box.oninput = () => {
            error.textContent = ""; // clear the error as soon as they keep typing
          };
          document.querySelector("#hit").onclick = () => {
            const text = box.value.trim();
            if (text.length < MIN_ANSWER_CHARS) {
              error.textContent = "That's a little short. Add a few more words, a short sentence is plenty.";
              return; // stop here: the shot doesn't happen yet
            }
            hitShot(text);
          };
        }
      }

      function showEnd() {
        panel.classList.add("bottom"); // move the panel down so the confetti is visible
        playHooray(); // celebrate as the final prompt appears
        panel.innerHTML = `
          <p class="shot">Hole complete</p>
          <h2>In the hole. You are up to par.</h2>
          <p>Here is what you said. Let it inspire what comes next.</p>
          <div class="recap"></div>
          <button class="primary" id="again">Play another hole</button>`;

        // Build the recap one answer at a time. textContent shows the words exactly as typed.
        const recap = panel.querySelector(".recap");
        responses.forEach((r) => {
          const item = document.createElement("div");
          item.className = "recap-item";

          const q = document.createElement("p");
          q.className = "recap-q";
          q.textContent = r.question;

          const a = document.createElement("p");
          a.className = "recap-a";
          a.textContent = r.answer;

          item.appendChild(q);
          item.appendChild(a);
          recap.appendChild(item);
        });

        document.querySelector("#again").onclick = () => location.reload();
      }

      // ---------- 5. MOVING THE BALL ----------
      // What the message says while the ball is flying, for each kind of landing
      // Three options for each; one is picked at random on every shot
      const shotWords = {
        fairway: [
          "Nice shot! Right in the fairway.",
          "Beautiful. That one's right down the middle.",
          "Smooth swing! Perfect lie.",
        ],
        rough: [
          "Rough shot. Don't worry, we can bounce back!",
          "Landed in the rough. Every golfer has been there.",
          "Not the best lie, but there's still a path to the hole.",
        ],
      };

      // Phrases not used yet. Each time one is picked, it is removed from here.
      const unused = {
        fairway: [...shotWords.fairway],
        rough: [...shotWords.rough],
      };

      // Picks a random phrase that hasn't been shown yet
      function pickComment(lie) {
        if (unused[lie].length === 0) {
          unused[lie] = [...shotWords[lie]]; // all used up, so start the list over
        }
        const index = Math.floor(Math.random() * unused[lie].length);
        return unused[lie].splice(index, 1)[0]; // take that phrase out and return it
      }
      let ballAt = { x: 0, z: 0 }; // where the ball is resting right now

      // Flies the ball to a spot: a high arc, then a few smaller bounces, then it settles.
      // Each phase: ms = how long it lasts, h = how high the ball goes,
      // frac = how far along the whole trip the ball is when the phase ends (1 = the end).
      function flyBall(to) {
        const from = { x: ballAt.x, z: ballAt.z };
        const phases = [
          { ms: FLIGHT_MS, h: 5, frac: 0.8 }, // the flight: lands 80% of the way there
          { ms: 450, h: 1.2, frac: 0.93 }, // first bounce
          { ms: 280, h: 0.5, frac: 0.98 }, // second bounce
          { ms: 200, h: 0.15, frac: 1 }, // last little hop, then it rests
        ];
        let phase = 0;
        let startTime = performance.now();
        let startFrac = 0;

        function frame(now) {
          const p = phases[phase];
          const u = Math.min(Math.max((now - startTime) / p.ms, 0), 1); // progress in this phase, 0 to 1
          const frac = startFrac + (p.frac - startFrac) * u; // progress along the whole trip

          ball.object3D.position.set(
            from.x + (to.x - from.x) * frac,
            0.3 + p.h * 4 * u * (1 - u), // an arc: 0 at the start and end, p.h in the middle
            from.z + (to.z - from.z) * frac
          );

          if (u < 1) {
            requestAnimationFrame(frame);
          } else if (phase < phases.length - 1) {
            startFrac = p.frac;
            phase++;
            startTime = now;
            requestAnimationFrame(frame);
          } else {
            ballAt = { x: to.x, z: to.z };
          }
        }
        requestAnimationFrame(frame);
      }

      function hitShot(answer) {
        answers.push(answer);
        responses.push({ question: fillIn(prompts[current].text), answer: answer });
        panel.style.display = "none"; // hide the panel while the ball travels

        const lie = getLie(prompts[current], answer); // "fairway" or "rough"
        const before = route[current];
        current++;
        const here = route[current];
        const spot = here[lie]; // the "x y z" spot for that lie

        // Show a message while the ball is in the air
        const isLastShot = current === prompts.length; // the last shot always drops in the hole
        shotMessage.textContent = isLastShot ? "And it's in the hole!" : pickComment(lie);
        shotMessage.classList.toggle("rough", lie === "rough" && !isLastShot);
        shotMessage.classList.add("show");
        const [x, , z] = spot.split(" ").map(Number); // pull the x and z numbers out of "x y z"

        // Step 1: the ball flies and bounces to its landing spot (with a ping when it's hit)
        playPing();
        flyBall({ x, z });

        // Step 2: when the ball first touches down, the camera walks up to it
        setTimeout(() => {
          player.setAttribute(
            "animation__move",
            `property: position; to: ${spot}; dur: ${RIG_MS}; easing: easeInOutQuad`
          );

          // Step 3: when the camera arrives, turn if the route says so
          setTimeout(() => {
            if (here.turn !== before.turn) {
              player.setAttribute(
                "animation__turn",
                `property: rotation; to: 0 ${here.turn} 0; dur: ${TURN_MS}; easing: easeInOutQuad`
              );
              setTimeout(arrive, TURN_MS);
            } else {
              arrive();
            }
          }, RIG_MS);
        }, FLIGHT_MS);
      }

      // ---------- 5b. CONFETTI ----------
      // Shoots small colored pieces up out of the hole. They fall, tumble, and settle on the grass.
      function confetti() {
        const scene = document.querySelector("a-scene");
        const colors = ["#e8737f", "#ffffff", "#f6d365", "#7f9fe0", "#8cc79a", "#c4505c"];
        const pieces = [];

        for (let i = 0; i < 90; i++) {
          const el = document.createElement("a-plane");
          el.setAttribute("width", "0.2");
          el.setAttribute("height", "0.13");
          el.setAttribute("material", `shader: flat; side: double; color: ${colors[i % colors.length]}`);
          el.setAttribute("position", "24 0.3 -24"); // starts right at the hole
          scene.appendChild(el);

          pieces.push({
            el: el,
            vx: (Math.random() - 0.5) * 5, // sideways speed
            vy: 5 + Math.random() * 4, // upward speed
            vz: (Math.random() - 0.5) * 5, // forward/back speed
            spin: 3 + Math.random() * 6, // how fast it tumbles
            landed: false,
          });
        }

        const GRAVITY = 6; // pulls the pieces down (lower = floatier)
        let last = performance.now();
        const begin = last;

        function frame(now) {
          const dt = (now - last) / 1000; // seconds since the last frame
          last = now;

          pieces.forEach((p) => {
            if (p.landed) return;
            const pos = p.el.object3D.position;
            p.vy -= GRAVITY * dt; // gravity speeds up the fall
            pos.x += p.vx * dt;
            pos.y += p.vy * dt;
            pos.z += p.vz * dt;
            p.el.object3D.rotation.x += p.spin * dt;
            p.el.object3D.rotation.y += p.spin * 0.7 * dt;

            if (pos.y <= 0.03) {
              // it hit the ground: lie flat and stop
              pos.y = 0.03;
              p.el.object3D.rotation.x = -Math.PI / 2;
              p.landed = true;
            }
          });

          if (now - begin < 9000) {
            requestAnimationFrame(frame);
          } else {
            pieces.forEach((p) => p.el.remove()); // clean up
          }
        }
        requestAnimationFrame(frame);
      }

      function arrive() {
        shotMessage.classList.remove("show"); // hide the message
        panel.style.display = "block";
        if (current < prompts.length) {
          showPrompt();
        } else {
          // Shrink the ball to nothing so it looks like it drops in the cup
          ball.setAttribute("animation__drop", "property: scale; to: 0 0 0; dur: 700");
          setTimeout(confetti, 500); // burst once the ball has dropped in
          showEnd();
        }
      }

      // ---------- 6. DECORATION: TREES, BUSHES AND FLOWERS ----------
      // (You can skip reading this part for now. It fills the course with greenery.)
      const trees = document.querySelector("#trees");

      // Knobs to turn: how much extra scenery to add. Lower numbers = a faster-loading page.
      const SCENERY = { extraTrees: 50, farTrees: 220, bushes: 40, flowerPatches: 22 };

      const treeGreens = ["#3f7f57", "#4c8f5f", "#2f6b47", "#5aa06a", "#356b4f"];
      const lightGreens = ["#6fb27a", "#5aa06a", "#7bbf86"];
      const flowerColors = ["#e8737f", "#f6d365", "#ffffff", "#b48ee0", "#f4a259"];

      function pick(list) {
        return list[Math.floor(Math.random() * list.length)];
      }
      function between(min, max) {
        return min + Math.random() * (max - min);
      }

      // One tree. style is "round" (ball on a trunk), "pine" (stacked triangles) or "cone" (one tall cone).
      // size is a multiplier: about 0.7 is a short tree, about 1.8 is a tall one.
      function plantTree(x, z, size, style) {
        const tree = document.createElement("a-entity");
        tree.setAttribute("position", `${x} 0 ${z}`);
        tree.setAttribute("scale", `${size} ${size} ${size}`);

        const trunk = `<a-cylinder position="0 0.8 0" radius="0.25" height="1.6" segments-radial="6" color="#8a6a4a"></a-cylinder>`;
        let top;
        if (style === "round") {
          top = `<a-sphere position="0 2.8 0" radius="1.4" segments-width="10" segments-height="8" color="${pick(lightGreens)}"></a-sphere>`;
        } else if (style === "pine") {
          const c = pick(treeGreens);
          top = `
            <a-cone position="0 2.2 0" radius-bottom="1.5" radius-top="0" height="1.8" segments-radial="8" segments-height="1" color="${c}"></a-cone>
            <a-cone position="0 3.3 0" radius-bottom="1.15" radius-top="0" height="1.6" segments-radial="8" segments-height="1" color="${c}"></a-cone>
            <a-cone position="0 4.3 0" radius-bottom="0.75" radius-top="0" height="1.4" segments-radial="8" segments-height="1" color="${c}"></a-cone>`;
        } else {
          top = `<a-cone position="0 3 0" radius-bottom="1.4" radius-top="0" height="3.6" segments-radial="8" segments-height="1" color="${pick(treeGreens)}"></a-cone>`;
        }
        tree.innerHTML = trunk + top;
        trees.appendChild(tree);
      }

      // A tree with a random style and a random size between minSize and maxSize
      function plantAnyTree(x, z, minSize, maxSize) {
        plantTree(x, z, between(minSize, maxSize), pick(["round", "pine", "cone"]));
      }

      // A low, squashed bush made of two overlapping blobs
      function plantBush(x, z) {
        const bush = document.createElement("a-entity");
        bush.setAttribute("position", `${x} 0 ${z}`);
        const color = pick(["#4c8f5f", "#3f7f57", "#5aa06a", "#2f6b47"]);
        const r = between(0.45, 0.8);
        bush.innerHTML = `
          <a-sphere position="0 ${r * 0.6} 0" radius="${r}" scale="1 0.75 1" segments-width="8" segments-height="6" color="${color}"></a-sphere>
          <a-sphere position="${r * 0.7} ${r * 0.45} ${r * 0.2}" radius="${r * 0.7}" scale="1 0.75 1" segments-width="8" segments-height="6" color="${color}"></a-sphere>`;
        trees.appendChild(bush);
      }

      // A patch of tiny flowers, mostly one color
      function plantFlowers(cx, cz) {
        const color = pick(flowerColors);
        const count = Math.floor(between(5, 10));
        for (let i = 0; i < count; i++) {
          const f = document.createElement("a-sphere");
          f.setAttribute("position", `${cx + between(-0.8, 0.8)} 0.14 ${cz + between(-0.8, 0.8)}`);
          f.setAttribute("radius", between(0.07, 0.12).toFixed(2));
          f.setAttribute("segments-width", "6");
          f.setAttribute("segments-height", "4");
          f.setAttribute("color", Math.random() < 0.8 ? color : pick(flowerColors));
          trees.appendChild(f);
        }
      }

      // A cheap far-away tree: just ONE shape (a cone or a rounded blob), so we can plant lots of them
      const farGreens = ["#2f6b47", "#356b4f", "#3f7f57", "#4c8f5f", "#2b5e41"];
      function plantFarTree(x, z) {
        const kind = pick(["cone", "round", "tall"]);
        const color = pick(farGreens);
        let tree;
        if (kind === "round") {
          const r = between(1.8, 2.8);
          tree = document.createElement("a-sphere");
          tree.setAttribute("radius", r.toFixed(1));
          tree.setAttribute("scale", "1 1.3 1"); // stretched tall like a rounded tree
          tree.setAttribute("position", `${x} ${(r * 1.1).toFixed(1)} ${z}`);
          tree.setAttribute("segments-width", "8");
          tree.setAttribute("segments-height", "6");
        } else {
          const tall = kind === "tall";
          const h = tall ? between(9, 13) : between(5, 9);
          tree = document.createElement("a-cone");
          tree.setAttribute("radius-bottom", (tall ? between(1.2, 1.7) : between(1.5, 2.4)).toFixed(1));
          tree.setAttribute("radius-top", "0");
          tree.setAttribute("height", h.toFixed(1));
          tree.setAttribute("position", `${x} ${(h / 2).toFixed(1)} ${z}`);
          tree.setAttribute("segments-radial", "8");
          tree.setAttribute("segments-height", "1");
        }
        tree.setAttribute("color", color);
        trees.appendChild(tree);
      }

      // Two rings of big, flattened green hills all the way around the course.
      // They are the "wall" that hides the flat edge of the world.
      function plantHills() {
        const cx = 14; // roughly the middle of the course
        const cz = -12;
        const rings = [
          { radius: 105, count: 36, size: [26, 38], offset: 0, colors: ["#4f8f63", "#58996b", "#4a8860"] },
          { radius: 140, count: 30, size: [34, 46], offset: 0.5, colors: ["#86b99a", "#93c3a5", "#7fb092"] },
        ];
        rings.forEach((ring) => {
          for (let i = 0; i < ring.count; i++) {
            const angle = ((i + ring.offset) / ring.count) * Math.PI * 2; // spread evenly around a circle
            const dist = ring.radius + between(-8, 8);
            const hill = document.createElement("a-sphere");
            hill.setAttribute("position", `${cx + Math.cos(angle) * dist} 0 ${cz + Math.sin(angle) * dist}`);
            hill.setAttribute("radius", between(ring.size[0], ring.size[1]).toFixed(1));
            hill.setAttribute("scale", `1 ${between(0.35, 0.55).toFixed(2)} 1`); // squash it flat into a hill
            hill.setAttribute("segments-width", "14");
            hill.setAttribute("segments-height", "8");
            hill.setAttribute("color", pick(ring.colors));
            trees.appendChild(hill);
          }
        });
      }

      // Places that must stay clear (the fairway, where balls land, where the camera swings, water and sand).
      // Each one is a box: [left, right, far, near] in x and z.
      const keepClear = [
        [-4.8, 4.8, -29, 8], // the first stretch of fairway
        [-4.8, 29, -29, -19], // the second stretch
        [-6.5, -3, -27, -9], // where a ball in the left rough lands
        [-12.5, 2, -31, -16], // where the camera swings around the bend
        [5, 16, -31.5, -27], // where a ball in the rough lands on the second stretch
        [-8.8, -3.2, -1.8, 3.8], // water
        [18, 22.5, -31.5, -27.5], // sand
      ];
      function isFree(x, z) {
        return !keepClear.some(([x1, x2, z1, z2]) => x > x1 && x < x2 && z > z1 && z < z2);
      }

      // Drops "count" things at random spots inside a box, skipping the keep-clear places
      function scatter(count, xMin, xMax, zMin, zMax, plant) {
        let placed = 0;
        let tries = 0;
        while (placed < count && tries < count * 20) {
          tries++;
          const x = between(xMin, xMax);
          const z = between(zMin, zMax);
          if (isFree(x, z)) {
            plant(x, z);
            placed++;
          }
        }
      }

      // --- The trees right around the fairway (a mix of styles and sizes) ---
      // Left edge of leg 1 (stops before the bend so the camera has room)
      for (let z = -2; z > -17; z -= 3.2) {
        plantAnyTree(-(7 + Math.random() * 2.5), z, 0.8, 1.3);
      }
      // Back edge, behind leg 2 (the outside of the bend)
      for (let x = -9; x < 34; x += 3) {
        plantAnyTree(x, -32 - Math.random() * 2.5, 0.8, 1.7);
      }
      // End wall, past the hole
      for (let z = -18; z > -35; z -= 3) {
        plantAnyTree(34 + Math.random() * 3, z, 0.9, 1.7);
      }
      // THE INSIDE-OF-THE-BEND FOREST: thick and always tall, this is what hides the hole
      for (let x = 6; x <= 31; x += 2.4) {
        for (let z = -1; z > -17; z -= 2.4) {
          plantAnyTree(x + (Math.random() - 0.5), z + (Math.random() - 0.5), 1.3, 1.8);
        }
      }

      // --- More trees farther away, mixing short and tall (full detail) ---
      const midTree = (x, z) => plantAnyTree(x, z, 0.7, 1.9);
      scatter(Math.round(SCENERY.extraTrees * 0.45), -34, 58, -48, -36, midTree); // behind the hole
      scatter(Math.round(SCENERY.extraTrees * 0.25), -30, -12, -40, 10, midTree); // to the left
      scatter(Math.round(SCENERY.extraTrees * 0.2), 34, 50, -40, 8, midTree); // to the right
      scatter(Math.round(SCENERY.extraTrees * 0.1), -22, 22, 10, 16, midTree); // behind the tee

      // --- A big, cheap forest even farther out (one shape per tree) ---
      scatter(Math.round(SCENERY.farTrees * 0.45), -55, 85, -78, -48, plantFarTree); // behind the hole
      scatter(Math.round(SCENERY.farTrees * 0.2), -62, -30, -78, 32, plantFarTree); // to the left
      scatter(Math.round(SCENERY.farTrees * 0.2), 52, 88, -78, 32, plantFarTree); // to the right
      scatter(Math.round(SCENERY.farTrees * 0.15), -55, 85, 18, 42, plantFarTree); // behind the tee

      // --- Rings of hills to hide the edge of the world ---
      plantHills();

      // --- Bushes along the edges of the course ---
      scatter(Math.round(SCENERY.bushes * 0.3), -9, -5.2, -17, 6, plantBush); // left of the first stretch
      scatter(Math.round(SCENERY.bushes * 0.22), 4.9, 6.2, -17, 6, plantBush); // right, at the foot of the forest
      scatter(Math.round(SCENERY.bushes * 0.22), 0, 30, -33, -29.2, plantBush); // outside of the second stretch
      scatter(Math.round(SCENERY.bushes * 0.16), 5, 30, -18.9, -17.5, plantBush); // inside of the second stretch
      scatter(Math.round(SCENERY.bushes * 0.1), -10, 10, 8, 11, plantBush); // behind the tee

      // --- Flower patches ---
      scatter(Math.round(SCENERY.flowerPatches * 0.3), -8.5, -5.3, -16, 6, plantFlowers);
      scatter(Math.round(SCENERY.flowerPatches * 0.25), 5.2, 6.4, -16, 6, plantFlowers);
      scatter(Math.round(SCENERY.flowerPatches * 0.3), 0, 30, -33, -29.3, plantFlowers);
      scatter(Math.round(SCENERY.flowerPatches * 0.15), 29, 33, -33, -19, plantFlowers);

      // ---------- 6b. CALM MUSIC ----------
      // Optional: paste a link to a calm .mp3 you have the rights to use. Leave it empty
      // and the page makes its own soft music: slow chords with a few gentle notes on top.
      const MUSIC_URL = "";

      let musicVolume = 0.5; // 0 = silent, 1 = full. The slider changes this.
      let setVolume = () => {}; // startMusic() fills this in once the music exists

      const volumeSlider = document.querySelector("#volume");
      volumeSlider.oninput = () => {
        musicVolume = volumeSlider.value / 100; // the slider gives 0 to 100
        setVolume();
      };

      function startMusic() {
        if (MUSIC_URL) {
          const song = new Audio(MUSIC_URL);
          song.loop = true;
          song.volume = musicVolume;
          setVolume = () => { song.volume = musicVolume; };
          song.play();
          return;
        }

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        // Master volume: starts silent and fades in over 4 seconds
        const master = ctx.createGain();
        master.gain.setValueAtTime(0, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.3 * musicVolume, ctx.currentTime + 4);

        // When the slider moves, glide to the new volume (cancel the old plan first)
        setVolume = () => {
          const now = ctx.currentTime;
          master.gain.cancelScheduledValues(now);
          master.gain.setValueAtTime(master.gain.value, now);
          master.gain.linearRampToValueAtTime(0.3 * musicVolume, now + 0.15);
        };

        // A soft echo makes it sound roomy
        const echo = ctx.createDelay();
        echo.delayTime.value = 0.5;
        const echoLevel = ctx.createGain();
        echoLevel.gain.value = 0.4;
        master.connect(ctx.destination);
        master.connect(echo);
        echo.connect(echoLevel);
        echoLevel.connect(echo);
        echoLevel.connect(ctx.destination);

        // Plays one note that swells in and fades out
        function tone(freq, start, length, volume, type) {
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          env.gain.setValueAtTime(0, start);
          env.gain.linearRampToValueAtTime(volume, start + length * 0.3);
          env.gain.linearRampToValueAtTime(0, start + length);
          osc.connect(env);
          env.connect(master);
          osc.start(start);
          osc.stop(start + length + 0.1);
        }

        // Each chord is four note frequencies (in Hz)
        const chords = [
          [130.81, 196.0, 246.94, 329.63], // C
          [110.0, 164.81, 261.63, 329.63], // A minor
          [87.31, 130.81, 220.0, 261.63], // F
          [98.0, 146.83, 246.94, 293.66], // G
        ];
        const topNotes = [523.25, 587.33, 659.25, 783.99, 880.0]; // gentle high notes

        let step = 0;
        function playNextChord() {
          const now = ctx.currentTime;
          chords[step % chords.length].forEach((f) => tone(f, now, 9, 0.35, "triangle"));
          for (let i = 0; i < 2; i++) {
            const f = topNotes[Math.floor(Math.random() * topNotes.length)];
            tone(f, now + 1 + Math.random() * 6, 3, 0.12, "sine");
          }
          step++;
        }

        playNextChord();
        setInterval(playNextChord, 8000); // a new chord every 8 seconds
      }

      // ---------- 6c. THE BALL-HIT "POCK" (a soft tennis-ball hit) ----------
      let sfxContext; // the sound engine for effects, created the first time it's needed

      // Gives back the sound engine for effects, creating it the first time
      function getSfx() {
        if (!sfxContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          sfxContext = new AudioCtx();
        }
        if (sfxContext.state === "suspended") sfxContext.resume();
        return sfxContext;
      }

      function playPing() {
        const ctx = getSfx();
        const now = ctx.currentTime;

        const THUD_START = 330; // pitch (Hz) of the hollow "body" at the instant of the hit
        const THUD_END = 170; // pitch it sinks to
        const POCK_PITCH = 1100; // where the fuzzy "pock" sits. Lower = duller and softer

        const out = ctx.createGain(); // overall volume
        out.gain.value = 0.4;
        out.connect(ctx.destination);

        // 1. The hollow "body" of the ball: a soft low tone that sinks a little and is gone fast
        const thud = ctx.createOscillator();
        thud.type = "sine";
        thud.frequency.setValueAtTime(THUD_START, now);
        thud.frequency.exponentialRampToValueAtTime(THUD_END, now + 0.07);
        const thudEnv = ctx.createGain();
        thudEnv.gain.setValueAtTime(0, now);
        thudEnv.gain.linearRampToValueAtTime(0.7, now + 0.003);
        thudEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        thud.connect(thudEnv);
        thudEnv.connect(out);
        thud.start(now);
        thud.stop(now + 0.15);

        // 2. The felt "pock": a short puff of noise, filtered so it sounds fuzzy and muffled
        const length = Math.floor(ctx.sampleRate * 0.08);
        const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1; // random noise
        }
        const pock = ctx.createBufferSource();
        pock.buffer = buffer;

        const fuzz = ctx.createBiquadFilter(); // keeps only the sounds around POCK_PITCH
        fuzz.type = "bandpass";
        fuzz.frequency.value = POCK_PITCH;
        fuzz.Q.value = 1;

        const pockEnv = ctx.createGain();
        pockEnv.gain.setValueAtTime(0.9, now);
        pockEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        pock.connect(fuzz);
        fuzz.connect(pockEnv);
        pockEnv.connect(out);
        pock.start(now);
      }

      // ---------- 6d. THE "HOORAY" ----------
      // Optional: paste a link to a real cheering sound (.mp3) you have the rights to use.
      // Leave it empty and the page makes its own: a little fanfare plus clapping and cheering.
      const HOORAY_URL = "";

      function playHooray() {
        if (HOORAY_URL) {
          const cheer = new Audio(HOORAY_URL);
          cheer.volume = 0.6;
          cheer.play();
          return;
        }

        const ctx = getSfx();
        const now = ctx.currentTime;

        const out = ctx.createGain(); // overall volume
        out.gain.value = 0.35;
        out.connect(ctx.destination);

        // 1. A quick rising fanfare: C, E, G, then a long high C
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const start = now + i * 0.12;
          const length = i === 3 ? 1.2 : 0.4;
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          env.gain.setValueAtTime(0, start);
          env.gain.linearRampToValueAtTime(0.5, start + 0.02);
          env.gain.exponentialRampToValueAtTime(0.001, start + length);
          osc.connect(env);
          env.connect(out);
          osc.start(start);
          osc.stop(start + length + 0.05);
        });

        // 2. Applause: lots of tiny random claps, filtered, that swell up and fade out
        const seconds = 3;
        const clapLength = Math.floor(ctx.sampleRate * seconds);
        const clapBuffer = ctx.createBuffer(1, clapLength, ctx.sampleRate);
        const clapData = clapBuffer.getChannelData(0);
        let clap = 0;
        for (let i = 0; i < clapLength; i++) {
          clap *= 0.995; // each clap dies away in a few thousandths of a second
          if (Math.random() < 0.002) clap = 1; // now and then, a new clap starts
          clapData[i] = (Math.random() * 2 - 1) * clap;
        }
        const claps = ctx.createBufferSource();
        claps.buffer = clapBuffer;
        const clapFilter = ctx.createBiquadFilter();
        clapFilter.type = "bandpass";
        clapFilter.frequency.value = 2200;
        clapFilter.Q.value = 0.7;
        const clapEnv = ctx.createGain();
        clapEnv.gain.setValueAtTime(0, now + 0.2);
        clapEnv.gain.linearRampToValueAtTime(1.4, now + 0.8);
        clapEnv.gain.linearRampToValueAtTime(0, now + seconds);
        claps.connect(clapFilter);
        clapFilter.connect(clapEnv);
        clapEnv.connect(out);
        claps.start(now + 0.2);

        // 3. A crowd "yaaay": airy noise whose pitch glides upward, like a cheer
        const cheerLength = Math.floor(ctx.sampleRate * 2);
        const cheerBuffer = ctx.createBuffer(1, cheerLength, ctx.sampleRate);
        const cheerData = cheerBuffer.getChannelData(0);
        for (let i = 0; i < cheerLength; i++) {
          cheerData[i] = Math.random() * 2 - 1;
        }
        const cheer = ctx.createBufferSource();
        cheer.buffer = cheerBuffer;
        const vowel = ctx.createBiquadFilter();
        vowel.type = "bandpass";
        vowel.Q.value = 3;
        vowel.frequency.setValueAtTime(600, now + 0.3);
        vowel.frequency.linearRampToValueAtTime(1300, now + 1.0);
        const cheerEnv = ctx.createGain();
        cheerEnv.gain.setValueAtTime(0, now + 0.3);
        cheerEnv.gain.linearRampToValueAtTime(0.9, now + 0.8);
        cheerEnv.gain.linearRampToValueAtTime(0, now + 2.2);
        cheer.connect(vowel);
        vowel.connect(cheerEnv);
        cheerEnv.connect(out);
        cheer.start(now + 0.3);
      }

      // ---------- 6e. FULL SCREEN ----------
      // We make the WHOLE PAGE go full screen (not just the 3D picture),
      // so the prompts, messages and sliders stay on top of the scene.
      document.querySelector("#fs-button").onclick = () => {
        const root = document.documentElement;
        const isFull = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFull) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          const goFull = root.requestFullscreen || root.webkitRequestFullscreen;
          if (goFull) goFull.call(root);
        }
      };

      // ---------- 7. START ----------
      showStart();
    </script>
  </body>
</html>
