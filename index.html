<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play a Hole</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
      /* ---------- The prompt panel that sits on top of the 3D scene ---------- */
      #panel {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: min(520px, 92vw);
        padding: 20px 22px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.94);
        color: #1f3d2b;
        font-family: "Nunito", system-ui, sans-serif;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        z-index: 10;
      }
      #panel h2 {
        margin: 0 0 12px;
        font-size: 1.15rem;
        font-weight: 700;
      }
      #panel p {
        margin: 0 0 14px;
        line-height: 1.4;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 18px;
        border: 2px solid #1f3d2b;
        border-radius: 999px;
        background: #fff;
        color: #1f3d2b;
        cursor: pointer;
      }
      button:hover {
        background: #1f3d2b;
        color: #fff;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #e8737f;
        outline-offset: 2px;
      }
      button.primary {
        background: #1f3d2b;
        color: #fff;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 90px;
        padding: 12px;
        margin-bottom: 12px;
        border: 2px solid #9bbfa8;
        border-radius: 12px;
        font: inherit;
        resize: vertical;
      }
    </style>
  </head>

  <body>
    <!-- ================= THE 3D WORLD ================= -->
    <a-scene vr-mode-ui="enabled: false">
      <!-- Sky and ground -->
      <a-sky color="#bfe3f5"></a-sky>
      <a-plane rotation="-90 0 0" width="200" height="200" color="#5f9f6e"></a-plane>

      <!-- Fairway: a lighter strip of grass running down the middle -->
      <a-plane
        rotation="-90 0 0"
        position="0 0.01 -22"
        width="8"
        height="64"
        color="#8cc79a"
      ></a-plane>

      <!-- Water on the left, sand on the right (from your sketch) -->
      <a-circle rotation="-90 0 0" position="-6 0.02 1" radius="2.2" color="#7f9fe0"></a-circle>
      <a-circle rotation="-90 0 0" position="6 0.02 -14" radius="2.2" color="#e6d3b3"></a-circle>

      <!-- Red tee markers -->
      <a-cylinder position="-1.5 0.3 0" radius="0.1" height="0.6" color="#e03a2f"></a-cylinder>
      <a-cylinder position="1.5 0.3 0" radius="0.1" height="0.6" color="#e03a2f"></a-cylinder>

      <!-- The hole and the flag in the distance -->
      <a-circle rotation="-90 0 0" position="0 0.02 -40" radius="0.35" color="#111"></a-circle>
      <a-cylinder position="0 1.5 -40" radius="0.04" height="3" color="#ddd"></a-cylinder>
      <a-plane position="0.5 2.6 -40" width="1" height="0.7" color="#e8737f" side="double"></a-plane>

      <!-- Trees get added here by the script at the bottom -->
      <a-entity id="trees"></a-entity>

      <!--
        PLAYER GROUP: the camera, the ball, and the sign all live inside this one
        entity. When we move the group, everything moves together.
        (Position 0 0 3.5 puts the ball at the tee, since the ball is 3.5 units ahead.)
      -->
      <a-entity id="player" position="0 0 3.5">
        <a-camera position="0 1.6 0" wasd-controls="enabled: false"></a-camera>

        <!-- The golf ball -->
        <a-sphere id="ball" position="0 0.3 -3.5" radius="0.3" color="#ffffff"></a-sphere>

        <!-- The sign that shows each question -->
        <a-entity position="0 3.4 -10">
          <a-plane width="7.5" height="2.6" color="#fffdf7"></a-plane>
          <a-text
            id="signTitle"
            value="Welcome"
            position="0 0.8 0.02"
            align="center"
            width="6"
            color="#e8737f"
          ></a-text>
          <a-text
            id="signText"
            value="Take a break! Play a hole."
            position="0 -0.1 0.02"
            align="center"
            width="6.5"
            wrap-count="26"
            color="#1f3d2b"
          ></a-text>
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- ================= THE PROMPT PANEL (regular HTML) ================= -->
    <div id="panel"></div>

    <script>
      // ---------- 1. THE PROMPTS ----------
      // Edit this list to change the questions. Each one is a "shot".
      // type "choice" = tap a button, type "text" = type in a box.
      const prompts = [
        {
          type: "choice",
          text: "How was your day?",
          options: ["Fantastic", "Meh", "Not my best"],
        },
        {
          type: "text",
          text: "What is one thing on your mind right now?",
          placeholder: "Type it out. No one else will see this.",
        },
        {
          type: "choice",
          text: "Which word is closest to how you feel?",
          options: ["Stressed", "Tired", "Anxious", "Okay"],
        },
        {
          type: "text",
          text: "What would you tell a friend who felt this way?",
          placeholder: "Say it the way you would to a friend.",
        },
      ];

      // ---------- 2. THINGS WE NEED TO KEEP TRACK OF ----------
      const player = document.querySelector("#player");
      const ball = document.querySelector("#ball");
      const signTitle = document.querySelector("#signTitle");
      const signText = document.querySelector("#signText");
      const panel = document.querySelector("#panel");

      const startZ = 3.5; // where the player begins
      const endZ = -36.5; // where the player ends (ball lands on the hole at z = -40)
      const stepSize = (startZ - endZ) / prompts.length; // distance of each shot

      let current = 0; // which prompt we are on (0 = the first one)
      const answers = []; // answers live only in this browser tab; nothing is sent anywhere

      // ---------- 3. SHOWING WHAT IS ON THE PANEL ----------
      function showStart() {
        panel.innerHTML = `
          <h2>Take a break. Play a hole.</h2>
          <p>Four shots. Answer each one and watch the ball travel toward the flag.</p>
          <button class="primary" id="go">Tee off</button>`;
        document.querySelector("#go").onclick = showPrompt;
      }

      function showPrompt() {
        const p = prompts[current];
        signTitle.setAttribute("value", `Shot ${current + 1} of ${prompts.length}`);
        signText.setAttribute("value", p.text);

        if (p.type === "choice") {
          panel.innerHTML = `<h2>${p.text}</h2><div class="options"></div>`;
          const box = panel.querySelector(".options");
          p.options.forEach((label) => {
            const b = document.createElement("button");
            b.textContent = label;
            b.onclick = () => hitShot(label);
            box.appendChild(b);
          });
        } else {
          panel.innerHTML = `
            <h2>${p.text}</h2>
            <textarea id="answer" placeholder="${p.placeholder}"></textarea>
            <button class="primary" id="hit">Hit the shot</button>`;
          const box = document.querySelector("#answer");
          box.focus();
          document.querySelector("#hit").onclick = () => {
            if (box.value.trim() === "") return; // ignore empty answers
            hitShot(box.value.trim());
          };
        }
      }

      function showEnd() {
        signTitle.setAttribute("value", "Hole complete");
        signText.setAttribute("value", "You said it out loud. You are up to par.");
        panel.innerHTML = `
          <h2>In the hole.</h2>
          <p>You put your thoughts into words, and that counts. Take a breath.</p>
          <button class="primary" id="again">Play another hole</button>`;
        document.querySelector("#again").onclick = () => location.reload();
      }

      // ---------- 4. MOVING THE BALL ----------
      function hitShot(answer) {
        answers.push(answer);
        panel.innerHTML = ""; // clear the panel while the ball travels
        panel.style.display = "none";
        current++;

        const newZ = startZ - stepSize * current;

        // A-Frame's "animation" component slides the player group to a new position
        player.setAttribute(
          "animation",
          `property: position; to: 0 0 ${newZ}; dur: 2400; easing: easeInOutQuad`
        );

        // When the slide finishes, decide what comes next
        player.addEventListener(
          "animationcomplete",
          () => {
            panel.style.display = "block";
            if (current < prompts.length) {
              showPrompt();
            } else {
              dropIntoHole();
            }
          },
          { once: true }
        );
      }

      function dropIntoHole() {
        // Shrink the ball to nothing so it looks like it drops in the cup
        ball.setAttribute("animation__drop", "property: scale; to: 0 0 0; dur: 700");
        showEnd();
      }

      // ---------- 5. DECORATION: PLANT TREES ALONG BOTH SIDES ----------
      // (You can skip reading this part for now. It just repeats a tree shape.)
      const trees = document.querySelector("#trees");
      for (let z = -3; z > -50; z -= 3.5) {
        [-1, 1].forEach((side) => {
          const x = side * (7 + Math.random() * 3);
          const tree = document.createElement("a-entity");
          tree.setAttribute("position", `${x} 0 ${z + Math.random() * 2}`);
          tree.innerHTML = `
            <a-cylinder position="0 0.8 0" radius="0.25" height="1.6" color="#8a6a4a"></a-cylinder>
            <a-cone position="0 3 0" radius-bottom="1.4" radius-top="0" height="3.6" color="#3f7f57"></a-cone>`;
          trees.appendChild(tree);
        });
      }

      // ---------- 6. START ----------
      showStart();
    </script>
  </body>
</html>
